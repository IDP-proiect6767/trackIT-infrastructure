name: Kong Validate

on:
  push:
    paths:
      - "kong/**"
  pull_request:
    paths:
      - "kong/**"

jobs:
  validate:
    name: Validate Kong declarative config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deck
        run: |
          curl -sL https://github.com/kong/deck/releases/download/v1.38.1/deck_1.38.1_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin deck

      - name: Validate kong.yml
        run: deck file validate kong/kong.yml
